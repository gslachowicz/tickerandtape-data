name: tmp fin check
on: workflow_dispatch
permissions:
  contents: write
jobs:
  chk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "" | base64 -d > financials.py
          echo "" | base64 -d > t.py
          python3 t.py
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git checkout --orphan tmp-fin; git rm -rq --cached . ; git add fin.txt; git commit -qm fin; git push -f origin tmp-fin
