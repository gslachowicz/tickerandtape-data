name: Live prices

# Replaced by the Quotes workflow (prices every minute). Kept to run by hand with force = yes; runs started without it
# (an older API Worker) do nothing, so they never overwrite the newer prices.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Run anyway (yes)"
        default: "no"

permissions:
  contents: write

concurrency:
  group: live
  cancel-in-progress: true

jobs:
  quotes:
    if: inputs.force == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gslachowicz/fundamental-technical-charts
          token: ${{ secrets.CODE_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch intraday prices
        run: python scripts/live_prices.py live.json

      # live.json goes to the "live" branch of this repository (one commit, replaced every time), so the main
      # history stays clean and the site rebuild is not triggered
      - name: Publish to the live branch
        run: |
          mkdir pub && mv live.json pub/ && cd pub
          git init -q -b live
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live.json
          git commit -q -m "Live prices"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" live
