name: tmp base compare
on: workflow_dispatch
permissions:
  contents: write
jobs:
  cmp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -q pandas numpy
          mkdir -p new old
          echo "" | base64 -d > new/bases.py
          echo "" | base64 -d > old/bases.py
          echo "" | base64 -d > cmp.py
          python cmp.py
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git checkout --orphan tmp-cmp; git rm -rq --cached . ; git add cmp.txt; git commit -qm cmp; git push -f origin tmp-cmp
