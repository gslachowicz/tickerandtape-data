name: tmp contraction scan
on: workflow_dispatch
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          echo "" | base64 -d > s.js
          node s.js
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git checkout --orphan tmp-vcx; git rm -rq --cached . ; git add vcx.txt t; git commit -qm vcx; git push -f origin tmp-vcx
