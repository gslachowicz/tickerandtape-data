name: tmp CIK lookup
on: workflow_dispatch
permissions:
  contents: write
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cat > l.py <<'PY'
          import requests, time, json, re
          H={"User-Agent":"Ticker&Tape research contacto@tickerandtape.com"}
          Q=[("fairx","Fairholme Capital"),("fairx","Fairholme"),("fairx","Berkowitz"),("GLRE","Greenlight"),("GLRE","Einhorn"),("GLRE","DME Capital"),("oa","Cooperman"),("oa","Omega"),("aq","Aquamarine"),("aq","Spier"),("VAN","Century Management"),("VAN","Van Den Berg")]
          for code,q in Q:
              try:
                  r=requests.get("https://efts.sec.gov/LATEST/search-index",params={"keysTyped":q},headers=H,timeout=30).json()
                  hits=r.get("hits",{}).get("hits",[])
              except Exception as e:
                  print(code,q,"ERR",e); continue
              out=[]
              for h in hits[:8]:
                  cik=int(h["_id"]); nm=h["_source"].get("entity","")
                  time.sleep(0.15)
                  try:
                      s=requests.get(f"https://data.sec.gov/submissions/CIK{cik:010d}.json",headers=H,timeout=30).json()
                      f=s["filings"]["recent"]; d=[f["filingDate"][i] for i,fm in enumerate(f["form"]) if fm in("13F-HR","13F-HR/A")]
                  except Exception: d=[]
                  if d: out.append(f"{cik}:{nm}:last13F={d[0]}:n={len(d)}")
              print(code,"|",q,"|"," || ".join(out) or "NONE")
              time.sleep(0.2)
          PY
          python l.py > cik.txt
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git checkout --orphan tmp-cik; git rm -rq --cached . ; git add cik.txt; git commit -qm cik; git push -f origin tmp-cik
